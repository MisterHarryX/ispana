<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('isp-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var ids = ['powder', 'quartz', 'peach', 'milk'];
        var q = new URLSearchParams(location.search);
        var p = q.get('palette');
        if (ids.indexOf(p) >= 0) { try { localStorage.setItem('isp-palette', p); } catch (e) {} }
        else { try { p = localStorage.getItem('isp-palette'); } catch (e) {} }
        document.documentElement.dataset.palette = ids.indexOf(p) >= 0 ? p : 'powder';
        if (q.has('colors') || q.has('palette')) document.documentElement.dataset.paletteUi = 'on';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- site:head -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;color:#2A1A1D;font-family:system-ui,sans-serif">
        Для просмотра сайта включите JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
